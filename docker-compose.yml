services:
  postgres-server:
    image: postgres:16-alpine
    container_name: zbx-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - zbx-postgres-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zbx-server
    environment:
      DB_SERVER_HOST: postgres-server
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZBX_ENABLE_SNMP_TRAPS: "true"
    depends_on:
      postgres-server:
        condition: service_healthy
    volumes:
      - zbx-server-data:/var/lib/zabbix
    ports:
      - "10051:10051"
    networks:
      backend:
      dmz:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  zabbix-snmptraps:
    image: zabbix/zabbix-snmptraps:alpine-7.0-latest
    container_name: zbx-snmptraps
    ports:
      - "162:162/udp"
    volumes:
      - zbx-snmptraps:/var/lib/zabbix/snmptraps
    networks:
      dmz:
        ipv4_address: 172.30.0.11
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zbx-web
    environment:
      DB_SERVER_HOST: postgres-server
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    depends_on:
      postgres-server:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks: [backend, frontend]
    restart: unless-stopped

  zabbix-agent-self:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zbx-agent-self
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
    volumes:
      - /:/hostfs:ro
    networks: [backend]
    restart: unless-stopped

  zabbix-agent-docker:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zbx-agent-docker
    environment:
      ZBX_HOSTNAME: "Docker Host"
      ZBX_SERVER_HOST: zabbix-server
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_PLUGINS: "docker"
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: noc-grafana
    environment:
      GF_SERVER_PROTOCOL: http
      GF_SERVER_ROOT_URL: https://painel.exemplo.com.br
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [frontend, backend]
    restart: unless-stopped

  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    depends_on: [zabbix-web, grafana]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    ports:
      - "443:443"
    networks: [frontend]
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/28

volumes:
  zbx-postgres-data:
  zbx-server-data:
  zbx-snmptraps:
  grafana-data:
