server {
    listen 443 ssl;
    http2 on;
    server_name mon.exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/mon.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mon.exemplo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    client_max_body_size 16m;

    location / {
        proxy_pass http://zabbix-web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
